spring.application.name=hospital-system
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Development account. Set both environment variables in deployed environments.
app.security.username=${HOSPITAL_ADMIN_USERNAME:admin}
app.security.password=${HOSPITAL_ADMIN_PASSWORD:Hospital@123}
app.security.max-login-attempts=5
app.security.lock-duration=15m
