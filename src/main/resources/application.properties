spring.application.name=hospital-system

spring.datasource.url=${HOSPITAL_DB_URL:jdbc:mysql://localhost:3306/hospital_system}
spring.datasource.username=${HOSPITAL_DB_USERNAME:root}
spring.datasource.password=${HOSPITAL_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 启动时执行 schema.sql；脚本使用 IF NOT EXISTS，可重复执行
spring.sql.init.mode=always


# MyBatis配置
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml


spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

