spring.application.name=hospital-system
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Development account. Set both environment variables in deployed environments.
app.security.username=${HOSPITAL_ADMIN_USERNAME:admin}
app.security.password=${HOSPITAL_ADMIN_PASSWORD:Hospital@123}
app.security.max-login-attempts=5
app.security.lock-duration=15m

spring.datasource.url=${HOSPITAL_DB_URL:jdbc:mysql://localhost:3306/hospital_system}
spring.datasource.username=${HOSPITAL_DB_USERNAME:root}
spring.datasource.password=${HOSPITAL_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 启动时执行 schema.sql；脚本使用 IF NOT EXISTS，可重复执行
spring.sql.init.mode=always


# MyBatis配置
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml